server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /app/fitness {
        return 302 /app/fitness/;
    }

    location = /app {
        return 302 /app/fitness/;
    }

    location = / {
        return 302 /app/fitness/;
    }

    # O cliente chama /api/* (relativo ao baseURL /app/fitness/). Repassa para
    # o gateway dos microservices sem o prefixo /app/fitness/api.
    location /app/fitness/api/ {
        proxy_pass http://gateway:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O nginx dos microservices injeta /app/fitness; o gateway não deve
        # reaplicar esse prefixo ao rotear /users, /fitness etc.
        proxy_set_header X-Forwarded-Prefix "";
    }

    location /app/fitness/ {
        try_files $uri $uri/index.html /app/fitness/index.html;
    }

    location ~* ^/app/fitness/_nuxt/.+\.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
